[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/astro"
  to = "/.netlify/functions/astro"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

